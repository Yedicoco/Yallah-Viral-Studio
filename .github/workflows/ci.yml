name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install deterministic TTS runtime (espeak-ng fallback)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-tts-espeak.txt

      - name: Run backend and TTS runtime checks
        run: npm run verify
        env:
          YVS_PYTHON: ${{ github.workspace }}/.venv/bin/python
          YVS_TTS_ENGINE: espeak

      - name: End-to-end MP4 smoke test
        run: npm run test:e2e
        env:
          YVS_PYTHON: ${{ github.workspace }}/.venv/bin/python
          YVS_TTS_ENGINE: espeak

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7
